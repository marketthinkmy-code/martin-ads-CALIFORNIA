name: adbot · build US East+Midwest 1-3-1 ABO (Video 2 check-up)

# 1 campaign · 3 ad sets (ABO RM50/day each: broad / Family & Relationships / Parents 3-17+Engaged)
# · 1 ad each, same creative. Region keys resolved live from Meta's geo search. One-shot, idempotent.

on:
  workflow_dispatch: {}

concurrency:
  group: adbot-build-east-midwest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build East+Midwest 1-3-1
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_east_midwest_1_3_1.py
