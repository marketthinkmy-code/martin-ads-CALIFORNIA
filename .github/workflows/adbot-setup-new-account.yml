name: adbot · setup NEW account (share pixel, rebuild audience, test Page)

on:
  workflow_dispatch: {}

concurrency:
  group: adbot-setup-new-account
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Setup
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_NEW_BM_TOKEN: ${{ secrets.META_NEW_BM_TOKEN }}
          META_NEW_BM_APP_SECRET: ${{ secrets.META_NEW_BM_APP_SECRET }}
        run: python scripts/setup_new_account.py
