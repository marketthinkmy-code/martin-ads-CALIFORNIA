name: adbot · diff object fields (read-only)

# Read-only: dump every readable field of the given ad sets / ads / creatives and list
# the fields that differ, to find the API fields behind manual Ads Manager settings.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Pipe-separated label=id pairs of the SAME object type"
        required: true

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Diff
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IDS: ${{ github.event.inputs.ids }}
        run: python -u scripts/diff_object_fields.py
