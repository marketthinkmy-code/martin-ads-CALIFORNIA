name: adbot · build Paid-List lookalike (customer list + 1-5% US LAL)

# Reads the current Paid Student List tab, builds a fresh customer-list custom audience
# (hashing PII inside the runner), then creates the 1% / 1-2% / 2-3% / 3-4% / 4-5% US
# lookalikes. Read-of-sheet + write-to-Meta only; no PII is logged. One-shot.

on:
  workflow_dispatch: {}

concurrency:
  group: adbot-build-lookalike-paidlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build paid-list custom audience + lookalikes
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_lookalike_paidlist.py
