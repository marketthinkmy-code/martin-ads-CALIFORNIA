name: adbot · build East+Midwest V4/V6 (2 campaigns, 1 ad set per video)

# Campaign A (Broad Advantage+) and Campaign B (interest: Family & Relationships), each with
# ONE AD SET PER VIDEO at RM50/day so no creative can starve another. Built PAUSED for review.

on:
  workflow_dispatch: {}

concurrency:
  group: adbot-build-em-v4-v6
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build East+Midwest V4/V6
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_em_v4_v6.py
