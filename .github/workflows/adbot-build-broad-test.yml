name: adbot · build BROAD (Advantage+) TEST RM100/day

# 1 CBO campaign + 1 broad ad set (geo+age only, no interests, Advantage Audience on) + top-3
# creatives. Attacks high CPM from narrow interest stacks. Meta writes only. Idempotent. One-shot.

on:
  workflow_dispatch: {}

concurrency:
  group: adbot-build-broad-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build broad test campaign
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/build_broad_test.py
