name: adbot · whoami (which system user is the CI token?)

# Read-only. Prints the identity behind META_SYSTEM_USER_TOKEN so the right system user
# can be granted access to the new ad account. No writes.

on:
  workflow_dispatch: {}

concurrency:
  group: adbot-whoami-token
  cancel-in-progress: false

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Identify token
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/whoami_token.py
