name: adbot · build single-image 1-1-3 (Advantage+ Parents+Engaged, ACTIVE)

# Downloads the 3 operator single-image PNGs, uploads them into the US account, and builds a
# single-image 1-1-3 campaign (CBO RM100/day) on Advantage+ Parents+Engaged with the supplied
# captions + 🔴 headlines + UTM url_tags. ACTIVE. Idempotent.

on:
  workflow_dispatch: {}

concurrency:
  group: adbot-build-single-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build single-image 1-1-3 (ACTIVE)
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: python scripts/build_single_image_1_1_3.py
      - name: Persist created entity IDs back to the branch
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "build-single-image: persist created ids [skip ci]" || echo "no state change"
          git push || echo "push skipped"
