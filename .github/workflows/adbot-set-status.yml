name: adbot · set status (operator-approved)

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated campaign / ad set / ad ids"
        required: true
      status:
        description: "ACTIVE or PAUSED (leave empty to change budget only)"
        required: false
        default: ""
      daily_budget:
        description: "New daily budget in minor units (6500 = RM65); empty = unchanged"
        required: false
        default: ""

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Set status
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IDS: ${{ github.event.inputs.ids }}
          STATUS: ${{ github.event.inputs.status }}
          DAILY_BUDGET: ${{ github.event.inputs.daily_budget }}
        run: python -u scripts/set_status.py
