name: adbot · add Video 5 to East+Midwest ad sets (1-3-1 -> 1-3-2)

# Uploads Video 5 (倒數計時), builds one creative, and adds it as a second ad in each of the
# three existing East+Midwest ad sets. Does not modify the campaign, ad sets, or Video 2 ads.

on:
  workflow_dispatch: {}

concurrency:
  group: adbot-add-video5-east-midwest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Add Video 5
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/add_video5_east_midwest.py
