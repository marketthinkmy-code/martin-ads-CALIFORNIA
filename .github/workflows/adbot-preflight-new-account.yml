name: adbot · preflight NEW account (can we actually run ads?)

# Checks account health, Page, pixel, audiences, and proves WRITE access by creating a
# PAUSED campaign and deleting it again. Leaves nothing behind.

on:
  workflow_dispatch: {}

concurrency:
  group: adbot-preflight-new-account
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Preflight
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/preflight_new_account.py
