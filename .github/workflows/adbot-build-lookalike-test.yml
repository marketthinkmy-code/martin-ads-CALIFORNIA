name: adbot · build Paid-List Lookalike TEST (1-5% x top-3 converters)

# Builds 1 CBO campaign + 5 ad sets (lookalike 1% / 1-2% / 2-3% / 3-4% / 4-5%) reusing the
# top-3 lifetime-converting creatives. Meta writes only. Idempotent via state. One-shot.

on:
  workflow_dispatch: {}

concurrency:
  group: adbot-build-lookalike-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build lookalike test campaign
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python scripts/build_lookalike_test.py
