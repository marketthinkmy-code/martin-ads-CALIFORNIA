name: adbot · build two 1-1-3 (FR + Parents3-17+Engaged, V5/6/7, ACTIVE)

# Uploads V5/V6/V7 once and builds TWO 1-1-3 campaigns (CBO RM100/day each): one on
# interest Family & Relationships, one on Parents 3-17 + Engaged. skill-written 馬丁醫師
# captions + UTM. ACTIVE. Idempotent.

on:
  workflow_dispatch: {}

concurrency:
  group: adbot-build-two-1-1-3
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build two 1-1-3 (ACTIVE)
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: python scripts/build_two_1_1_3_fr_pe.py
      - name: Persist created entity IDs back to the branch
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add state/ || true
          git commit -m "build-two-1-1-3: persist created ids [skip ci]" || echo "no state change"
          git push || echo "push skipped"
