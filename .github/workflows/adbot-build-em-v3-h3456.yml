name: adbot · build East+Midwest V3 + Hooks 3/4/5/6

# 2 campaigns (Parents 3-17+Engaged / Family and Relationships), each with ONE AD SET PER VIDEO
# at RM50/day: V3 自信 / H3 卷尺 / H4 丟保健品 / H5 基因 / H6 最矮的那一個.
# 10 ad sets, RM500/day. Age 35-65, landing page /us-register. Built PAUSED.

on:
  workflow_dispatch: {}

concurrency:
  group: adbot-build-em-v3-h3456
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build V3 + Hooks 3/4/5/6
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/build_em_v3_h3456.py
