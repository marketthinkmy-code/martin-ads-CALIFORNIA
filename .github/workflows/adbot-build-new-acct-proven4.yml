name: adbot · build NEW account · Proven 4 (Parents + F&R, $12/ad set, PAUSED)

on:
  workflow_dispatch: {}

concurrency:
  group: adbot-build-new-acct-proven4
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - name: Build
        env:
          ADBOT_ROOT: ${{ github.workspace }}
          ADBOT_CONFIG: ${{ github.workspace }}/config/config.yaml
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_NEW_BM_TOKEN: ${{ secrets.META_NEW_BM_TOKEN }}
          META_NEW_BM_APP_SECRET: ${{ secrets.META_NEW_BM_APP_SECRET }}
        run: python scripts/build_new_acct_proven4.py
